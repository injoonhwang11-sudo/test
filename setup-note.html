</style></head><body><div id="app"></div><script type="module">const uid = () => crypto.randomUUID();
function initialState() {
  return {version:1, strategies:[{id:uid(),name:'추세 눌림목 · 샘플',sample:true,thresholds:{'A+':90,A:80,B:70},items:[
    {id:uid(),label:'상위 시간대의 추세와 진입 방향이 일치한다',weight:25,required:true},
    {id:uid(),label:'진입 전 손절 가격과 리스크를 정했다',weight:20,required:true},
    {id:uid(),label:'주요 지지·저항 구간에서 반응이 확인된다',weight:20,required:false},
    {id:uid(),label:'거래량이 셋업을 뒷받침한다',weight:15,required:false},
    {id:uid(),label:'계획한 손익비가 2R 이상이다',weight:10,required:false},
    {id:uid(),label:'충동이 아닌 사전 계획에 따른 진입이다',weight:10,required:false}
  ]}],records:[]};
}
function evaluate(strategy, checked) {
  const total=strategy.items.reduce((s,i)=>s+i.weight,0);
  const earned=strategy.items.reduce((s,i)=>s+(checked.includes(i.id)?i.weight:0),0);
  const score=total?earned/total*100:0;
  const missing=strategy.items.filter(i=>!checked.includes(i.id));
  const blocked=missing.some(i=>i.required);
  const grade=blocked||!total?'PASS':score>=strategy.thresholds['A+']?'A+':score>=strategy.thresholds.A?'A':score>=strategy.thresholds.B?'B':'PASS';
  return {score,earned,total,missing,blocked,grade};
}
function statistics(records) {
  return ['A+','A','B','PASS'].map(grade=>{
    const all=records.filter(r=>r.grade===grade), closed=all.filter(r=>r.status==='closed');
    return {grade,total:all.length,count:closed.length,skipped:all.filter(r=>r.status==='skipped').length,winRate:closed.length?closed.filter(r=>r.result>0).length/closed.length*100:null,average:closed.length?closed.reduce((s,r)=>s+r.result,0)/closed.length:null};
  });
}
function validateState(s) {
  const obj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  const str=x=>typeof x==='string';
  const id=x=>str(x)&&/^[a-zA-Z0-9_-]{1,100}$/.test(x);
  const num=x=>typeof x==='number'&&Number.isFinite(x);
  const unique=a=>new Set(a.map(x=>x.id)).size===a.length;
  if(!obj(s)||s.version!==1||!Array.isArray(s.strategies)||!s.strategies.length||!Array.isArray(s.records))throw Error('지원하지 않는 백업 형식입니다.');
  if(!unique(s.strategies)||!unique(s.records))throw Error('중복된 ID가 있습니다.');
  for(const p of s.strategies){
    const t=p.thresholds;
    if(!id(p.id)||!str(p.name)||!p.name.trim()||!obj(t)||![t['A+'],t.A,t.B].every(v=>num(v)&&v>0&&v<=100)||!(t['A+']>t.A&&t.A>t.B)||!Array.isArray(p.items)||!p.items.length||!unique(p.items))throw Error('매매법 또는 등급 기준이 올바르지 않습니다.');
    for(const i of p.items)if(!id(i.id)||!str(i.label)||!i.label.trim()||!num(i.weight)||i.weight<0||typeof i.required!=='boolean')throw Error('체크리스트 항목이 올바르지 않습니다.');
    if(!p.items.some(i=>i.weight>0))throw Error('배점 합계는 0보다 커야 합니다.');
  }
  for(const r of s.records)if(!id(r.id)||!str(r.createdAt)||!Number.isFinite(Date.parse(r.createdAt))||!str(r.symbol)||!str(r.strategyName)||!str(r.note)||!['long','short'].includes(r.direction)||!['A+','A','B','PASS'].includes(r.grade)||!num(r.score)||r.score<0||r.score>100||!['pending','closed','skipped'].includes(r.status)||(r.status==='closed'?!num(r.result):r.result!==null)||!Array.isArray(r.conditions)||r.conditions.some(c=>!obj(c)||!str(c.label)||typeof c.checked!=='boolean'||typeof c.required!=='boolean'||!num(c.weight)||c.weight<0))throw Error('평가 기록이 올바르지 않습니다.');
  return s;
}

const KEY='setup-note-v1';
let state, loadError=false;
try { const raw=localStorage.getItem(KEY); state=raw?validateState(JSON.parse(raw)):initialState(); } catch {state=initialState();loadError=true;}
let tab='evaluate',selected=state.strategies[0].id,checked=[],symbol='',direction='long',note='',filter='all',draft=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const signed=n=>`${n>0?'+':''}${n.toFixed(2)}R`;
const fmt=d=>new Date(d).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
function toast(msg){$('#toast')?.remove();const el=document.createElement('div');el.id='toast';el.role='status';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),4000);}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));state=next;return true;}catch{toast('저장 공간에 접근할 수 없습니다. JSON으로 백업해 주세요.');return false;}}
function current(){return state.strategies.find(s=>s.id===selected)||state.strategies[0];}
function badge(g){return `<span class="badge grade-${g==='A+'?'plus':g.toLowerCase()}">${g}</span>`;}
function render(){
$('#app').innerHTML=`<aside class="sidebar"><a class="brand" href="#"><span class="brand-icon">≋</span> 셋업 노트<span class="brand-dot"></span></a><div class="workspace-label">TRADING WORKSPACE</div><nav>${[['evaluate','◈','진입 전 평가'],['records','▤','평가 기록'],['stats','▥','성과 분석'],['settings','⚙','체크리스트 설정']].map(([id,icon,label])=>`<button class="nav-item ${tab===id?'active':''}" data-tab="${id}"><span>${icon}</span>${label}${id==='records'?`<small>${state.records.length}</small>`:''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="local-dot">이 브라우저에 자동 저장</div><p>나만의 기준을 세우고,<br>기록으로 검증하세요.</p><button class="text-btn" id="export">↗ JSON 내보내기</button><label class="text-btn import-label">↙ JSON 가져오기<input type="file" id="import" accept="application/json,.json" hidden></label></div></aside><main><header><div class="breadcrumb">워크스페이스 <span>/</span> ${ {evaluate:'진입 전 평가',records:'평가 기록',stats:'성과 분석',settings:'체크리스트 설정'}[tab]}</div><div class="header-actions"><span class="private-label">● LOCAL & PRIVATE</span><button class="text-btn" id="mobile-export">내보내기</button><button class="text-btn" id="mobile-import">가져오기</button></div></header><div class="content">${tab==='evaluate'?evaluation():tab==='records'?records():tab==='stats'?stats():settings()}</div><footer>SETUP NOTE <span>등급은 조건 충족도이며, 승률이나 수익을 예측하지 않습니다.</span></footer></main>`;
bind();
}
function heading(k,title,sub){return `<div class="page-heading"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${sub}</p></div><span class="date-chip">${new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'})}</span></div>`;}
function evaluation(){const s=current(),e=evaluate(s,checked);return `${heading('PRE-TRADE CHECK','좋은 매매는, 진입 전에 시작됩니다.','계획한 조건을 하나씩 확인하고, 나의 기준에 맞는 셋업인지 평가하세요.')}<div class="eval-grid"><div class="left-col"><section class="panel"><div class="section-title"><h2><span class="step">01</span> 매매 정보</h2><span class="muted">평가할 셋업을 선택하세요</span></div><div class="info-grid"><label>종목 <span class="required-text">*</span><input id="symbol" maxlength="80" placeholder="예: BTCUSDT, 삼성전자" value="${esc(symbol)}"></label><div><label>진입 방향</label><div class="segmented"><button data-direction="long" class="${direction==='long'?'selected long':''}">↗ 매수 / Long</button><button data-direction="short" class="${direction==='short'?'selected short':''}">↘ 매도 / Short</button></div></div><label class="full">매매법<select id="strategy">${state.strategies.map(p=>`<option value="${p.id}" ${p.id===s.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label></div></section><section class="panel checklist"><div class="section-title"><h2><span class="step">02</span> 진입 체크리스트</h2><span class="count">${checked.length} / ${s.items.length} 충족</span></div>${s.sample?'<div class="sample-note"><span>샘플</span> 예시 조건입니다. 나의 매매법에 맞게 자유롭게 수정하세요.</div>':''}<div class="checklist-meta"><span>필수 조건은 모두 충족해야 합니다.</span><button class="text-btn" id="reset-checks">선택 초기화</button></div>${s.items.map((i,n)=>`<label class="check-row ${checked.includes(i.id)?'is-checked':''}"><input type="checkbox" data-check="${i.id}" ${checked.includes(i.id)?'checked':''}><span class="custom-check">✓</span><span class="condition"><small>CONDITION ${String(n+1).padStart(2,'0')}</small><span>${esc(i.label)}</span></span><span class="item-type ${i.required?'mandatory':''}">${i.required?'필수':'가산'}</span><span class="weight">${i.weight}<small>점</small></span></label>`).join('')}<div class="checklist-footer">배점 합계 ${e.total}점 <span>총점은 100점 기준으로 환산됩니다.</span></div></section><section class="panel"><div class="section-title"><h2><span class="step">03</span> 매매 메모</h2><span class="muted">선택 사항</span></div><textarea id="note" rows="3" placeholder="진입 근거, 주요 가격대, 주의할 점을 기록하세요.">${esc(note)}</textarea></section></div><div class="right-col"><section class="panel result-panel"><div class="section-title"><h2>셋업 평가</h2><span class="live"><i></i> LIVE</span></div><div class="score-ring" style="--progress:${e.score*3.6}deg"><div><strong>${Number(e.score.toFixed(1))}</strong><span>/ 100점</span></div></div><div class="grade-line">${badge(e.grade)}<span>${e.blocked?'필수 조건 확인 필요':e.grade==='PASS'?'진입 기준 미달':'진입 조건 충족'}</span></div><p class="grade-description">${e.blocked?'점수와 관계없이 필수 조건 미충족 시 PASS':`현재 ${e.earned} / ${e.total}점 · 가중치를 100점으로 환산`}</p><div class="grade-scale">${['A+','A','B'].map(g=>`<div class="${e.grade===g?'highlight':''}"><b>${g}</b><span>${s.thresholds[g]}점 이상</span></div>`).join('')}</div><div class="missing"><h3>${e.missing.length?'미충족 조건':'모든 조건을 충족했습니다'} <span>${e.missing.length}</span></h3>${e.missing.map(i=>`<p><span class="${i.required?'amber':''}">${i.required?'!':'·'}</span>${esc(i.label)}</p>`).join('')}</div><button class="primary" id="save-evaluation">평가 기록 저장 <span>↗</span></button><p class="save-hint">평가 후 기록에서 진입 여부와 결과를 입력하세요.</p></section><div class="tip"><span>↳</span><div><strong>점수보다 중요한 건 일관된 기준</strong><p>평가를 기록하고 실제 R 성과를 비교해<br>나의 셋업을 검증해 보세요.</p></div></div></div></div>`;}
function records(){const list=state.records.filter(r=>filter==='all'||r.status===filter);return `${heading('TRADE JOURNAL','판단의 순간을, 기록으로.','평가 당시의 조건은 보존됩니다. 거래 종료 후 손익을 R 단위로 입력하세요.')}<div class="toolbar"><div class="segmented">${[['all','전체'],['pending','결과 대기'],['closed','거래 완료'],['skipped','미진입']].map(([v,l])=>`<button data-filter="${v}" class="${filter===v?'selected':''}">${l}</button>`).join('')}</div><span class="muted">${list.length}개의 기록</span></div>${list.length?`<div class="record-list">${[...list].reverse().map(r=>`<section class="panel record"><div class="record-top"><div>${badge(r.grade)}<strong>${esc(r.symbol)}</strong><span class="${r.direction==='long'?'positive':'negative'}">${r.direction==='long'?'매수 / Long':'매도 / Short'}</span></div><time>${fmt(r.createdAt)}</time></div><p class="record-meta">${esc(r.strategyName)} · ${Number(r.score.toFixed(1))}점</p>${r.note?`<p class="record-note">${esc(r.note)}</p>`:''}<details><summary>평가 당시 체크리스트</summary>${r.conditions.map(c=>`<p class="snapshot">${c.checked?'✓':'○'} ${esc(c.label)} <small>${c.required?'필수':'가산'} · ${c.weight}점</small></p>`).join('')}</details><div class="record-result"><span>매매 결과</span><select data-status="${r.id}" aria-label="${esc(r.symbol)} 진입 상태"><option value="pending" ${r.status==='pending'?'selected':''}>결과 대기</option><option value="closed" ${r.status==='closed'?'selected':''}>거래 완료</option><option value="skipped" ${r.status==='skipped'?'selected':''}>미진입</option></select><form data-result="${r.id}"><input type="number" step="any" placeholder="예: -1, 2.5" aria-label="${esc(r.symbol)} 결과 R" value="${r.result??''}" required><span>R</span><button class="secondary" type="submit">결과 저장</button></form><button class="delete-btn" data-delete="${r.id}" aria-label="기록 삭제">삭제</button></div><p class="result-status">${r.status==='closed'?`<span class="${r.result>0?'positive':r.result<0?'negative':''}">확정 결과 ${signed(r.result)}</span>`:r.status==='skipped'?'미진입 · 성과 통계에서 제외':'결과 대기 · R 입력 후 저장하면 거래 완료로 변경됩니다.'}</p></section>`).join('')}</div>`:'<div class="empty panel"><span>▤</span><h2>아직 기록이 없습니다</h2><p>진입 전 평가를 저장하고, 나의 판단을 쌓아 보세요.</p><button class="secondary" data-tab="evaluate">첫 평가 시작하기 →</button></div>'}`;}
function stats(){const rows=statistics(state.records),closed=state.records.filter(r=>r.status==='closed'),total=closed.reduce((s,r)=>s+r.result,0);return `${heading('PERFORMANCE','기준의 가치를, 숫자로 확인하세요.','거래 완료 기록만 성과에 포함됩니다. 미진입과 결과 대기는 제외됩니다.')}<div class="metric-grid"><div class="panel metric"><label>완료 거래</label><strong>${closed.length}<small>건</small></strong></div><div class="panel metric"><label>승률</label><strong>${closed.length?(closed.filter(r=>r.result>0).length/closed.length*100).toFixed(1):'—'}<small>%</small></strong></div><div class="panel metric"><label>평균 R</label><strong class="${total>0?'positive':''}">${closed.length?signed(total/closed.length):'—'}</strong></div><div class="panel metric"><label>누적 R</label><strong>${closed.length?signed(total):'—'}</strong></div></div><section class="panel"><div class="section-title"><h2>등급별 성과</h2><span class="muted">실제 기록 기반</span></div><div class="table-wrap"><table><thead><tr><th>셋업 등급</th><th>평가 수</th><th>완료 거래</th><th>미진입</th><th>승률</th><th>평균 R</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${badge(r.grade)}</td><td>${r.total}</td><td>${r.count}</td><td>${r.skipped}</td><td>${r.winRate===null?'—':r.winRate.toFixed(1)+'%'}</td><td class="${r.average>0?'positive':r.average<0?'negative':''}">${r.average===null?'—':signed(r.average)}</td></tr>`).join('')}</tbody></table></div><div class="stats-note">승리 = 0R 초과 · 0R은 완료 거래 수에 포함되며 승리로 계산하지 않습니다.<br>기준 변경 전후의 기록이 함께 집계됩니다. 등급은 승률 예측이 아닌 조건 충족도입니다.</div></section>`;}
function settings(){if(!draft)draft=structuredClone(current());return `${heading('YOUR TRADING RULES','나만의 기준을 설계하세요.','필수 조건, 가산점, 등급 기준을 자유롭게 수정할 수 있습니다.')}<div class="toolbar"><select id="edit-strategy">${state.strategies.map(s=>`<option value="${s.id}" ${s.id===draft.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><button class="secondary" id="new-strategy">+ 매매법 추가</button></div><form id="settings-form"><section class="panel"><div class="section-title"><h2>매매법 설정</h2><label class="inline-label"><input type="checkbox" id="sample" ${draft.sample?'checked':''}> 샘플 표시</label></div><label>매매법 이름<input id="strategy-name" value="${esc(draft.name)}" required maxlength="100"></label><h3 class="subheading">등급 기준 <small>100점 환산 기준 · A+ &gt; A &gt; B &gt; 0</small></h3><div class="threshold-grid">${['A+','A','B'].map(g=>`<label>${g}<div class="input-suffix"><input type="number" data-threshold="${g}" min="0.01" max="100" step="any" value="${draft.thresholds[g]}" required><span>점 이상</span></div></label>`).join('')}</div></section><section class="panel"><div class="section-title"><h2>체크리스트 항목</h2><button type="button" class="secondary" id="add-item">+ 항목 추가</button></div><p class="muted settings-help">필수 항목 하나라도 미충족이면 PASS입니다. 필수 항목의 배점도 총점에 포함됩니다.</p><div class="editor-rows">${draft.items.map((i,n)=>`<div class="editor-row" data-item="${i.id}"><span class="row-number">${String(n+1).padStart(2,'0')}</span><label class="item-label">조건<input data-field="label" value="${esc(i.label)}" required></label><label class="weight-label">배점<input data-field="weight" type="number" min="0" step="any" value="${i.weight}" required></label><label class="inline-label"><input type="checkbox" data-field="required" ${i.required?'checked':''}> 필수</label><button type="button" class="delete-btn" data-remove="${i.id}" aria-label="항목 삭제">×</button></div>`).join('')}</div><div class="settings-actions"><span class="muted">저장한 변경은 새 평가부터 적용됩니다.</span><button class="primary" type="submit">설정 저장 ↗</button></div><p id="settings-error" role="alert" class="negative"></p></section></form>`;}
function captureDraft(){if(!draft)return;draft.name=$('#strategy-name').value.trim();draft.sample=$('#sample').checked;document.querySelectorAll('[data-threshold]').forEach(e=>draft.thresholds[e.dataset.threshold]=Number(e.value));document.querySelectorAll('[data-item]').forEach(row=>{const i=draft.items.find(i=>i.id===row.dataset.item);i.label=row.querySelector('[data-field="label"]').value.trim();i.weight=Number(row.querySelector('[data-field="weight"]').value);i.required=row.querySelector('[data-field="required"]').checked;});}
function bind(){
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(tab==='settings')captureDraft();if(tab==='settings'&&draft&&JSON.stringify(draft)!==JSON.stringify(state.strategies.find(s=>s.id===draft.id))&&!confirm('저장하지 않은 설정을 버리고 이동할까요?'))return;tab=b.dataset.tab;draft=null;render();});
$('#symbol')?.addEventListener('input',e=>symbol=e.target.value);$('#note')?.addEventListener('input',e=>note=e.target.value);
document.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>{direction=b.dataset.direction;render();});
$('#strategy')?.addEventListener('change',e=>{selected=e.target.value;checked=[];render();});
document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{checked=b.checked?[...checked,b.dataset.check]:checked.filter(id=>id!==b.dataset.check);render();});
$('#reset-checks')?.addEventListener('click',()=>{checked=[];render();});
$('#save-evaluation')?.addEventListener('click',()=>{if(!symbol.trim()){toast('종목을 입력해 주세요.');$('#symbol').focus();return;}const s=current(),e=evaluate(s,checked),r={id:uid(),createdAt:new Date().toISOString(),symbol:symbol.trim(),direction,strategyName:s.name,strategyId:s.id,note,grade:e.grade,score:e.score,status:'pending',result:null,conditions:s.items.map(i=>({...i,checked:checked.includes(i.id)}))};if(persist({...state,records:[...state.records,r]})){checked=[];symbol='';note='';tab='records';render();toast('평가를 저장했습니다. 결과는 나중에 입력할 수 있습니다.');}});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();});
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('이 평가 기록을 삭제할까요?')){if(persist({...state,records:state.records.filter(r=>r.id!==b.dataset.delete)}))render();}});
document.querySelectorAll('[data-status]').forEach(el=>el.onchange=()=>{const r=state.records.find(r=>r.id===el.dataset.status);if(el.value==='closed'&&r.result===null){el.value=r.status;toast('R 결과를 입력하고 결과 저장을 눌러 주세요.');el.closest('.record').querySelector('input[type="number"]').focus();return;}if(r.status==='closed'&&el.value!=='closed'&&!confirm('기존 R 결과를 지우고 상태를 변경할까요?')){el.value=r.status;return;}const status=el.value;if(persist({...state,records:state.records.map(v=>v.id===r.id?{...v,status,result:status==='closed'?v.result:null}:v)}))render();});
document.querySelectorAll('[data-result]').forEach(form=>form.onsubmit=e=>{e.preventDefault();const input=form.querySelector('input'),value=Number(input.value);if(!input.value.trim()||!Number.isFinite(value)){toast('유효한 R 값을 입력해 주세요.');return;}if(persist({...state,records:state.records.map(r=>r.id===form.dataset.result?{...r,status:'closed',result:value}:r)})){render();toast('매매 결과를 저장했습니다.');}});
$('#edit-strategy')?.addEventListener('change',e=>{if(!confirm('저장하지 않은 변경은 버리고 선택한 매매법을 불러올까요?')){e.target.value=draft.id;return;}selected=e.target.value;draft=structuredClone(current());render();});
$('#new-strategy')?.addEventListener('click',()=>{captureDraft();if(!confirm('저장하지 않은 변경은 버리고 새 매매법을 만들까요?'))return;draft={id:uid(),name:'새 매매법',sample:false,thresholds:{'A+':90,A:80,B:70},items:[{id:uid(),label:'',weight:100,required:true}]};render();});
$('#add-item')?.addEventListener('click',()=>{captureDraft();draft.items.push({id:uid(),label:'',weight:10,required:false});render();});
document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{captureDraft();if(draft.items.length===1){toast('체크리스트는 최소 한 항목이 필요합니다.');return;}draft.items=draft.items.filter(i=>i.id!==b.dataset.remove);render();});
$('#settings-form')?.addEventListener('submit',e=>{e.preventDefault();captureDraft();const next={...state,strategies:state.strategies.some(s=>s.id===draft.id)?state.strategies.map(s=>s.id===draft.id?structuredClone(draft):s):[...state.strategies,structuredClone(draft)]};try{validateState(next);}catch(err){$('#settings-error').textContent=err.message;return;}if(persist(next)){selected=draft.id;checked=[];render();toast('매매법과 등급 기준을 저장했습니다.');}});
$('#mobile-export').onclick=()=>$('#export').click();
$('#mobile-import').onclick=()=>$('#import').click();
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`setup-note-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error('10MB 이하 파일을 선택해 주세요.');const next=validateState(JSON.parse(await f.text()));if(!confirm(`매매법 ${next.strategies.length}개, 기록 ${next.records.length}개로 현재 데이터를 교체합니다. 먼저 내보내기로 백업했는지 확인해 주세요.`))return;if(persist(next)){selected=state.strategies[0].id;checked=[];symbol='';note='';draft=null;render();toast('백업을 가져왔습니다.');}}catch(err){toast(`가져오기 실패: ${err.message}`);}finally{e.target.value='';}};
}
render();if(loadError)toast('저장 데이터를 읽지 못했습니다. 기존 저장본은 덮어쓰지 않았습니다. 백업을 확인해 주세요.');
</script></body></html>
